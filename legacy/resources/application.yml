server:
  port: 8080
  servlet:
    session:
      timeout: 60m
  tomcat:
    uri-encoding: UTF-8

spring:
  profiles:
    # 默认使用 H2 免安装数据库，可直接运行体验；正式部署改为 mysql
    active: h2
  application:
    name: finance-analysis-system
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    static-path-pattern: /**

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.qst.finance.model
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: NULL
    default-statement-timeout: 120

finance:
  password-salt: QST@2026#CW
  cache-type: auto
  cache-expire-seconds: 1800
  import-batch-size: 100
  excel-max-rows: 50000
  auto-calc-after-transform: true
  demo-init: false

logging:
  level:
    root: info
    com.qst.finance: info
  file:
    name: ./logs/finance-analysis.log
