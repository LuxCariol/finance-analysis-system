# ============================================================
# 快速体验环境 : H2 内存库(MySQL 兼容模式) + JVM 内存缓存
# 无需安装 MySQL / Redis，直接启动即可看到完整功能与图表数据
# ============================================================
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:cw_finance;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;IGNORECASE=TRUE
    username: sa
    password: ''
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 20
      validation-query: SELECT 1
      test-while-idle: true
      filters: stat
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  redis:
    host: 127.0.0.1
    port: 6379
    timeout: 500ms

finance:
  cache-type: memory
  demo-init: false
