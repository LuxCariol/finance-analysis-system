server:
  port: 8006
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: financial-analysis
  mvc:
    view:
      prefix: /page/
      suffix: .jsp
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 120MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/financial_analysis?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

logging:
  level:
    com.qst.finance: info
    org.springframework.web: warn

app:
  demo-import: true
  default-password: "123456"
  page-size: 10
