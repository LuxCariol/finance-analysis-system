# ============================================================================
# 金融财务分析系统 - Nginx 反向代理与集群配置示例
# 部署说明见 README.md 第六章
# ============================================================================
upstream finance_server {
    # 两台系统运行服务器(AppServer1 / AppServer2)
    server 192.168.1.11:8080 weight=1 max_fails=2 fail_timeout=30s;
    server 192.168.1.12:8080 weight=1 max_fails=2 fail_timeout=30s;
    keepalive 32;
}

server {
    listen       80;
    server_name  finance.example.com;

    charset utf-8;
    client_max_body_size 50m;          # 财务 Excel 上传大小限制

    access_log  /app/cw/log/nginx_access.log;
    error_log   /app/cw/log/nginx_error.log;

    location / {
        proxy_pass         http://finance_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;    # 数据转换等耗时操作
        proxy_send_timeout    300s;
    }

    # 静态资源可交由 Nginx 直接处理(可选)
    location /web/ {
        root /app/cw/static;
        expires 1h;
    }
}
