<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>金融财务分析系统 - 登录</title>
    <link rel="stylesheet" href="/web/css/app.css">
</head>
<body>
<div class="login-wrap">
    <div class="login-box">
        <h1>金融财务分析系统</h1>
        <p class="sub">PC端后台管理系统 · SpringBoot + SSM + MyBatis</p>
        <div class="login-error" id="error"></div>
        <div class="form-row">
            <label>账号名称</label>
            <input type="text" id="accountName" value="root" placeholder="请输入账号名称" autocomplete="off">
        </div>
        <div class="form-row">
            <label>密码</label>
            <input type="password" id="pwd" value="123456" placeholder="请输入密码">
        </div>
        <button id="loginBtn">登 录</button>
        <div class="login-tip">
            演示账号：root / 123456（系统管理员）<br>
            财务总监 cwzj / 123456　财务人员 cwry / 123456　公司高层 gg / 123456
        </div>
    </div>
</div>
<script src="/web/js/api.js"></script>
<script>
    var errorBox = document.getElementById('error');
    var btn = document.getElementById('loginBtn');

    function login() {
        var accountName = document.getElementById('accountName').value.trim();
        var pwd = document.getElementById('pwd').value;
        if (!accountName || !pwd) {
            errorBox.textContent = '请输入账号名称和密码';
            return;
        }
        btn.disabled = true;
        btn.textContent = '登录中...';
        Api.post('/api/auth/login', {accountName: accountName, pwd: pwd}).then(function () {
            window.location.href = '/web/index.html';
        }).catch(function (e) {
            errorBox.textContent = e.message || '登录失败';
            btn.disabled = false;
            btn.textContent = '登 录';
        });
    }

    btn.addEventListener('click', login);
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
            login();
        }
    });
</script>
</body>
</html>
